name: Deploy to FTP

on:
  push:
    branches: [ main_cz ]

jobs:
  ftp-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Vytvoření názvu složky podle času
      - name: Create date folder name
        id: datefolder
        run: echo "FOLDER=$(date +'%d_%m_%Y___%H_%M')" >> $GITHUB_OUTPUT

      # Upload na FTP
      - name: Upload files via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21

          # Lokální adresář k nahrání
          local-dir: "./"

          # Cesta na serveru je nyní v Secrets + složka podle data
          server-dir: "${{ secrets.FTP_PATH }}${{ steps.datefolder.outputs.FOLDER }}/"

          # Pokud chceš ignorovat určité soubory, můžeš použít exclude
          # exclude: |
          #   .git*
          #   node_modules/
